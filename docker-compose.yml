services:
  postgres:
    image: postgres:16-alpine
    container_name: culinaryblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - culinaryblog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinaryblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: culinary-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  culinaryblog-postgres-data:
