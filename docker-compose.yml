services:
  engagement:
    image: culinaryblog-engagement:dev
    build:
      context: .
      dockerfile: services/CulinaryBlog.Engagement/Dockerfile
    container_name: culinaryblog-engagement
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=engagement-postgres;Port=5432;Database=engagement;Username=postgres;Password=postgres
      RecipeApiUrl: http://host.docker.internal:5000/
      Jwt__Key: culinary-blog-dev-secret-key-2026
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      engagement-postgres:
        condition: service_healthy

  api:
    image: culinaryblog-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: culinaryblog-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=culinaryblog;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: culinary-blog-dev-secret-key-2026
      Storage__Provider: Minio
      Minio__Endpoint: http://minio:9000
      Minio__PublicEndpoint: http://localhost:9000
      Minio__AccessKey: culinaryblog
      Minio__SecretKey: culinaryblog-secret
      Minio__BucketName: culinary-blog
      Minio__UseHttps: "false"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__From: noreply@culinaryblog.local
      Smtp__PublicApiUrl: http://localhost:5000
      HangfireDashboard__Username: ${HANGFIRE_DASHBOARD_USERNAME:-}
      HangfireDashboard__Password: ${HANGFIRE_DASHBOARD_PASSWORD:-}
      Seq__ServerUrl: http://seq:80
      Services__Engagement__BaseUrl: http://engagement:8080
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailhog:
        condition: service_started
      seq:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: culinaryblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - culinaryblog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culinaryblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  engagement-postgres:
    image: postgres:16-alpine
    container_name: culinaryblog-engagement-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: engagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - culinaryblog-engagement-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: culinaryblog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - culinaryblog-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: culinaryblog-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: culinaryblog-minio:community
    build:
      context: ./backend/docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
    container_name: culinaryblog-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: culinaryblog
      MINIO_ROOT_PASSWORD: culinaryblog-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - culinaryblog-minio-data:/data

  seq:
    image: datalust/seq:latest
    container_name: culinaryblog-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: admin
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-SeqAdmin@123}
    ports:
      - "5341:80"
    volumes:
      - culinaryblog-seq-data:/data

volumes:
  culinaryblog-postgres-data:
  culinaryblog-engagement-postgres-data:
  culinaryblog-redis-data:
  culinaryblog-minio-data:
  culinaryblog-seq-data:
