# Reverse proxy + TLS termination (SRS §6 Architecture, §5 Security/Reliability).
#   /api/*   -> api:8080       (ASP.NET Core)
#   /health* -> api:8080       (probe, không bị chặn bởi readiness gate)
#   /*       -> frontend:3000  (Next.js standalone)
# Readiness (SRS Reliability): PostgreSQL/dependency lỗi => /health/ready trả 503 => nginx trả 503 cho traffic.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Ảnh tối đa 5 MB (ImageFileValidation.MaxFileSize) + overhead multipart.
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/problem+json image/svg+xml;

    # Rate limit thô theo IP ở tầng proxy; rate limit chi tiết cho auth/upload nằm ở API (SRS Security).
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_status 429;

    # Cache ngắn kết quả readiness để không gọi API cho mỗi request.
    proxy_cache_path /var/cache/nginx/ready levels=1 keys_zone=ready_cache:1m max_size=1m inactive=1m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Docker DNS: resolve lại khi container được tạo lại.
    resolver 127.0.0.11 valid=10s ipv6=off;


    server {
        listen 80;
        server_name _;

        # Health probe qua HTTP cho Docker/orchestrator, còn lại chuyển sang HTTPS.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # --- Readiness gate -------------------------------------------------
        # auth_request chỉ nhận 2xx; 503 từ /health/ready bị nginx đổi thành 500 rồi map lại 503 bên dưới.
        location = /_ready {
            internal;
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream/health/ready;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_cache ready_cache;
            proxy_cache_key "ready";
            proxy_cache_valid 200 503 2s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location @unavailable {
            default_type application/problem+json;
            add_header Retry-After 5 always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Dependencies are not ready."}';
        }

        # --- Health: không gate, để probe thấy được trạng thái thật -----------
        location /health {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
        }

        # --- Auth.js (NextAuth) chạy trên frontend, không phải backend ----------
        location /api/auth/ {
            auth_request /_ready;
            error_page 500 502 503 504 = @unavailable;

            set $web_upstream http://frontend:3000;
            proxy_pass $web_upstream;
        }

        # --- API ------------------------------------------------------------
        location /api/ {
            auth_request /_ready;
            error_page 500 502 503 504 = @unavailable;

            limit_req zone=api_per_ip burst=40 nodelay;
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
        }

        # --- Static assets của Next.js (hash trong tên file => cache bất biến) ---
        location /_next/static/ {
            set $web_upstream http://frontend:3000;
            proxy_pass $web_upstream;
            proxy_cache off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # --- Ảnh công thức (MinIO, bucket public-read) cùng origin -------------
        # Trình duyệt không với tới minio:9000 / localhost:9000 của máy chủ khi vào qua tunnel,
        # nên ảnh được phục vụ qua đây: https://<site>/culinary-blog/...
        location /culinary-blog/ {
            set $minio_upstream http://minio:9000;
            proxy_pass $minio_upstream;
            proxy_buffering on;
            client_max_body_size 0;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # --- Frontend -------------------------------------------------------
        location / {
            auth_request /_ready;
            error_page 500 502 503 504 = @unavailable;

            set $web_upstream http://frontend:3000;
            proxy_pass $web_upstream;
        }
    }
}
