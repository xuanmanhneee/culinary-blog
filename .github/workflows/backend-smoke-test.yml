name: Backend smoke test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start dependencies
        run: docker compose up -d postgres redis minio

      - name: Restore
        run: dotnet restore backend/src/CulinaryBlog.API/CulinaryBlog.API.csproj

      - name: Build backend
        run: dotnet build backend/src/CulinaryBlog.API/CulinaryBlog.API.csproj --no-restore --configuration Release

      - name: Seed development data
        run: >-
          dotnet run
          --project backend/src/CulinaryBlog.API/CulinaryBlog.API.csproj
          --no-build
          --configuration Release
          -- --seed

      - name: Run API and smoke test
        shell: pwsh
        run: |
          $apiLog = Join-Path $env:RUNNER_TEMP "culinary-blog-api.log"
          $apiErrorLog = Join-Path $env:RUNNER_TEMP "culinary-blog-api-error.log"
          $api = Start-Process dotnet `
            -ArgumentList @(
              "run",
              "--project", "backend/src/CulinaryBlog.API/CulinaryBlog.API.csproj",
              "--no-build",
              "--configuration", "Release",
              "--urls", "http://localhost:5000"
            ) `
            -RedirectStandardOutput $apiLog `
            -RedirectStandardError $apiErrorLog `
            -PassThru

          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $health = Invoke-RestMethod "http://localhost:5000/health/ready"
                if ($health.status -eq "Healthy") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }

            if (-not $ready) {
              Get-Content $apiLog -ErrorAction SilentlyContinue
              Get-Content $apiErrorLog -ErrorAction SilentlyContinue
              throw "API did not become ready in time."
            }

            & "$PWD/backend/scripts/smoke-test.ps1" -BaseUrl "http://localhost:5000"
            if ($LASTEXITCODE -ne 0) {
              throw "Smoke test failed with exit code $LASTEXITCODE."
            }
          } finally {
            if (-not $api.HasExited) {
              Stop-Process -Id $api.Id -Force
            }
            Get-Content $apiLog -ErrorAction SilentlyContinue
            Get-Content $apiErrorLog -ErrorAction SilentlyContinue
          }

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis minio

      - name: Stop dependencies
        if: always()
        run: docker compose down -v
